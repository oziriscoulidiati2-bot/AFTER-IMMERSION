  function shuffle(array){
  let arr = [...array];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function home(){

  <div class="card">
    <h2>🇬🇧 English commando</h2>

    <button class="mission-btn" onclick="startMission()">
      ⚡ MODE MISSION COMMANDO

  /*qcm*/
function openChapter(chapter){
  state.currentChapter = chapter;
  app.innerHTML = `
  <div class="card">
    <h2>${chapter}</h2>
    <button onclick="startQCM()">🎯 Start QCM</button>
    <button onclick="notify('Pas encore de devoirs')">English test</button>
    <br><br>
    <button class="quit-btn" onclick="home()">Quitter</button>
  </div>`;
}

function startQCM(){
  state.qIndex = 0;
  showQCM();
}

function showQCM(){
  const qcm = chapters[state.currentChapter].qcm;
  const q = qcm[state.qIndex];

  const shuffled = shuffle(
    q.options.map((text, index) => ({ text, index }))
  );

  state.currentCorrect = shuffled.findIndex(o => o.index === q.answer);

  app.innerHTML = `
  <div class="card">
    <h3>Q${state.qIndex + 1}: ${q.question}</h3>
    <p id="qcmTimer">⏳ 30s</p>
    ${shuffled.map((o,i)=>`
      <div class="option" onclick="answer(${i})">${o.text}</div>
    `).join("")}
    <p>XP: +${q.xp}</p>
    <button class="quit-btn" onclick="quitQCM()">Quitter</button>
  </div>`;

  clearInterval(state.qcmTimer);
  state.qcmTimeLeft = 30;

  state.qcmTimer = setInterval(()=>{
    state.qcmTimeLeft--;
    const t = document.getElementById("qcmTimer");
    if(t) t.innerHTML = `⏳ ${state.qcmTimeLeft}s`;
    if(state.qcmTimeLeft <= 0){
      clearInterval(state.qcmTimer);
      state.qIndex++;
      if(state.qIndex >= qcm.length){ home(); }
      else { showQCM(); }
    }
  }, 1000);
}

function quitQCM(){
  clearInterval(state.qcmTimer);
  state.qIndex = 0;
  notify("QCM quitté");
  openChapter(state.currentChapter);
}

function answer(choice){
  const qcm = chapters[state.currentChapter].qcm;
  const q = qcm[state.qIndex];
  const options = document.querySelectorAll(".option");

  clearInterval(state.qcmTimer);

  if(choice === state.currentCorrect){
    options[choice].classList.add("good");
    addXP(q.xp);
    notify("✅ Bonne réponse !", "success");
  } else {
    options[choice].classList.add("bad");
    options[state.currentCorrect].classList.add("good");
    notify("❌ Mauvaise réponse", "error");
  }

  setTimeout(()=>{
    state.qIndex++;
    if(state.qIndex >= qcm.length){
      notify("Chapitre terminé 🎉", "success");
      home();
    } else {
      showQCM();
    }
  }, 800);
}

  
  
/* ================= XP SYSTEM ================= */

function addXP(points){
  state.xp += points;
  if(state.xp >= state.level * 100){
    state.level++;
    notify("🔥 LEVEL UP !", "success");
  }
  localStorage.setItem("xp", state.xp);
  localStorage.setItem("level", state.level);
  updateXPBar();
}

function updateXPBar(){
  const fill = document.getElementById("xpFill");
  const xpLabel = document.getElementById("xpLabel");
  const levelLabel = document.getElementById("levelLabel");
  const percent = Math.min((state.xp % (state.level * 100)) / (state.level * 100) * 100, 100);
  if(fill) fill.style.width = percent + "%";
  if(xpLabel) xpLabel.innerHTML = "XP: " + state.xp;
  if(levelLabel) levelLabel.innerHTML = "Niveau " + state.level;
}
  
/* ================= ESSAYS ================= */

function getEssayProgress(){
  return JSON.parse(localStorage.getItem("essayProgress")) || {};
}

function saveEssayProgress(title, content){

  const progress = getEssayProgress();

  progress[title] = {
    content: content,
    done: true,
    updatedAt: new Date().toISOString()
  };

  localStorage.setItem(
    "essayProgress",
    JSON.stringify(progress)
  );
}

function essayMenu(){

  const essays = chapters["Chapitre 1"].essays;
  const progress = getEssayProgress();

  app.innerHTML = `
  <div class="card">

    <h2>✍️ Devoirs</h2>

    ${essays.map((e,i)=>{

      const done = progress[e.title];

      return `
      <button
        onclick="startEssay(${i})"
        style="
          background:${done ? '#22c55e' : '#3b82f6'};
        "
      >
        ${done ? '✅' : '📝'}
        ${e.title}
      </button>
      `;
    }).join("")}

  <br>
  
  <br>
  <button onclick="home()">
      ⬅️ Retour
    </button>

  </div>`;
}

function startEssay(i){

  const essay = chapters["Chapitre 1"].essays[i];

  state.essay = essay;
  state.timer = essay.time;

  clearInterval(state.interval);

  state.interval = setInterval(()=>{

    state.timer--;

    if(state.timer <= 0){

      clearInterval(state.interval);

      autoSaveEssay();

      notify("⏰ Temps écoulé !");
    }

    updateTimer();

  },1000);

  renderEssay();
}

function autoSaveEssay(){

  const textarea = document.getElementById("essayText");

  if(!textarea) return;

  saveEssayProgress(
    state.essay.title,
    textarea.value
  );
}

function liveSaveEssay(){

  const text =
    document.getElementById("essayText").value;

  saveEssayProgress(
    state.essay.title,
    text
  );
}

function finishEssay(){

  clearInterval(state.interval);

  const text =
    document.getElementById("essayText").value;

  saveEssayProgress(
    state.essay.title,
    text
  );

  addXP(state.essay.xp);

  notify("Devoir enregistré !");

  essayMenu();
}

function resetEssay(){

  const progress = getEssayProgress();

  delete progress[state.essay.title];

  localStorage.setItem(
    "essayProgress",
    JSON.stringify(progress)
  );

  renderEssay();
}

function updateTimer(){

  const timer = document.getElementById("timer");
  const fill = document.getElementById("fill");

  const minutes =
    Math.floor(state.timer / 60);

  const seconds =
    state.timer % 60;

  const formatted =
    `${minutes}:${seconds
      .toString()
      .padStart(2,"0")}`;

  if(timer){
    timer.innerHTML = `⏱️ ${formatted}`;
  }

  if(fill){
    fill.style.width =
      `${(state.timer/state.essay.time)*100}%`;
  }
}
/* ================= ESSAY UI ================= */

function renderEssay(){

  const progress = getEssayProgress();

  const oldAnswer =
    progress[state.essay.title]?.content || "";

  app.innerHTML = `
  
  
  <div class="card">

    <h3>${state.essay.title}</h3>

    <div class="bar">
      <div
        class="fill"
        id="fill"
        style="
          width:${(state.timer/state.essay.time)*100}%
        ">
      </div>
    </div>

    <p id="timer"></p>

    <p>
      ${state.essay.question}
    </p>

    <textarea
      id="essayText"
      placeholder="Rédige ta réponse..."
      oninput="liveSaveEssay()"
    >${oldAnswer}</textarea>

  <button onclick="sendEssay()">
    🤖 Corriger avec IA
  </button>
  
    <button onclick="finishEssay()">
      Enregister le devoir
    </button>

    <button onclick="resetEssay()">
       Refaire le devoir 
    </button>
  
  <br>
  
  <br>
  
  <br>
    <button onclick="essayMenu()">
      ⬅️ Retour
    </button>

  </div>`;
}



/* ================= SEND IA ================= */

function sendEssay(){

  const text = document.getElementById("essayText").value;

  if(!text.trim()){
    alert("Écris quelque chose !");
    return;
  }

  const prompt = `
Corrige ce devoir :

QUESTION:
${state.essay.question}

REPONSE:
${text}

Donne:
- note /20
- erreurs
- correction
`;

  window.open("https://chatgpt.com/?q=" + encodeURIComponent(prompt));
}

  /* ================= MISSION COMMANDO ================= */

function startMission(){
  // Collecter tous les QCM de tous les chapitres
  let allQCM = [];
  Object.keys(chapters).forEach(ch => {
    chapters[ch].qcm.forEach(q => {
      allQCM.push({...q, chapter: ch});
    });
  });

  // Mélanger et prendre 10
  const picked = shuffle(allQCM).slice(0, 10);

  state.mission = {
    questions: picked,
    index: 0,
    score: 0,
    timeLeft: 240, // 4 minutes
    answered: 0
  };

  showMissionQCM();
}

function showMissionQCM(){
  const m = state.mission;

  // Timer global
  clearInterval(state.missionTimer);
  state.missionTimer = setInterval(()=>{
    m.timeLeft--;
    const t = document.getElementById("missionClock");
    if(t){
      const min = Math.floor(m.timeLeft / 60);
      const sec = m.timeLeft % 60;
      t.innerHTML = `⏱ ${min}:${sec.toString().padStart(2,"0")}`;
      if(m.timeLeft <= 30) t.style.color = "#ef4444";
    }
    if(m.timeLeft <= 0){
      clearInterval(state.missionTimer);
      showMissionResult();
    }
  }, 1000);

  renderMissionQuestion();
}

function renderMissionQuestion(){
  const m = state.mission;
  const q = m.questions[m.index];
  const shuffled = shuffle(q.options.map((text, index) => ({ text, index })));
  m.currentCorrect = shuffled.findIndex(o => o.index === q.answer);

  const min = Math.floor(m.timeLeft / 60);
  const sec = m.timeLeft % 60;

  app.innerHTML = `
  <div class="card">
    <div class="mission-timer" id="missionClock">⏱ ${min}:${sec.toString().padStart(2,"0")}</div>
    <div class="mission-progress">Question ${m.index + 1} / 10 &nbsp;|&nbsp; ✅ ${m.score} bonne(s)</div>
    <p><strong>Q${m.index + 1} :</strong> ${q.question}</p>
    ${shuffled.map((o,i)=>`
      <div class="option" id="mopt${i}" onclick="answerMission(${i})">${o.text}</div>
    `).join("")}
    <button class="quit-btn" onclick="quitMission()" style="margin-top:15px">🚪 Abandonner</button>
  </div>`;
}

function answerMission(choice){
  const m = state.mission;
  const options = document.querySelectorAll(".option");

  // Désactiver les clics
  options.forEach(o => o.onclick = null);

  m.answered++;

  if(choice === m.currentCorrect){
    options[choice].classList.add("good");
    m.score++;
  } else {
    options[choice].classList.add("bad");
    options[m.currentCorrect].classList.add("good");
  }

  setTimeout(()=>{
    m.index++;
    if(m.index >= 10){
      clearInterval(state.missionTimer);
      showMissionResult();
    } else {
      renderMissionQuestion();
    }
  }, 1000);
}

function showMissionResult(){
  clearInterval(state.missionTimer);
  const m = state.mission;
  const note = m.answered === 0 ? 0 : Math.round((m.score / m.answered) * 10);
  const noteClass = note >= 7 ? "score-good" : note >= 5 ? "score-mid" : "score-bad";
  const emoji = note >= 7 ? "🏆" : note >= 5 ? "😅" : "💀";

  addXP(note * 10);

  app.innerHTML = `
  <div class="card score-card">
    <h2>⚡ Mission Commando</h2>
    <div class="score-note ${noteClass}">${emoji} ${note}/10</div>
    <p>${m.score} bonne(s) réponse(s) sur ${m.answered} question(s) répondues</p>
    <p style="color:#94a3b8;font-size:13px">+${note * 10} XP gagnés</p>
    <button onclick="startMission()">Rejouer</button>
    <button class="quit-btn" onclick="home()"> Accueil</button>
  </div>`;
}

function quitMission(){
  clearInterval(state.missionTimer);
  notify("Mission abandonnée", "error");
  home();
}
  
/* ================= INIT ================= */

home();
  
  function notify(message, type="info", duration=3500){

  const container = document.getElementById("notif-container");

  const div = document.createElement("div");
  div.className = `notif ${type}`;
  div.innerText = message;

  container.appendChild(div);

  setTimeout(()=>{
    div.remove();
  }, duration);
}

  
  
  
</script>
