<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropshipping</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{margin:0;font-family:Arial;background:#0b0b0f;color:white}

/* HEADER STYLE RESTORED */
.app-header{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
width:95%;
max-width:500px;

display:flex;
justify-content:space-between;
align-items:center;

gap:10px;
padding:10px 14px;

background:rgba(20,20,25,0.9);
backdrop-filter:blur(10px);

border-radius:50px;
border:1px solid #222;

z-index:6000;
}

.search{
flex:1;
padding:8px 12px;
border:none;
border-radius:20px;
background:#1c1c25;
color:white;
outline:none;
}

/* CONTAINER */
.container{padding-top:100px;padding-bottom:140px}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px}

/* CARD STYLE RESTORED */
.card{
background:#141420;
border-radius:18px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
border:1px solid #222;
box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

.card:hover{transform:scale(1.03)}

.card img{width:100%;height:140px;object-fit:cover}

.card-content{padding:12px}

.meta{font-size:12px;opacity:0.7;margin-top:4px}

/* PAGE */
.page{
position:fixed;
inset:0;
background:#0b0b0f;
display:none;
z-index:8000;
overflow:auto;
padding:15px;
}

.product{
background:#141420;
padding:12px;
border-radius:12px;
margin-top:10px;
display:flex;
justify-content:space-between;
border:1px solid #222;
}

.price{color:#00c853;font-weight:bold}

.loading{text-align:center;padding:20px;opacity:0.7}

/* SOCIAL BAR RESTORED (GLASS LIGHT) */
.social-bar{
position:fixed;
right:15px;
bottom:80px;
display:flex;
flex-direction:column;
gap:12px;
z-index:6000;
}

@media(min-width:768px){
.social-bar{top:50%;bottom:auto;transform:translateY(-50%)}
}

.social-btn{
width:50px;height:50px;
display:flex;align-items:center;justify-content:center;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,0.2);
border-radius:20%;

color:white;font-size:20px;
transition:0.3s;
}

.social-btn:hover{
background:#00c853;color:black;transform:scale(1.15);
}

/* FLOATING DOCK RESTORED */
.floating-dock{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);

display:flex;
gap:10px;

background:rgba(20,20,25,0.9);
backdrop-filter:blur(10px);

padding:10px;
border-radius:50px;

box-shadow:0 10px 25px rgba(0,0,0,0.4);
z-index:5000;
}

.dock-item{
padding:10px 14px;
border-radius:30px;
color:white;text-decoration:none;font-size:14px;
transition:0.2s;
}

.dock-item:hover,.dock-item.active{
background:#00c853;color:black;transform:scale(1.05);
}

</style>
</head>

<body>

<header class="app-header">
<span>📦 Dropshipping</span>
<input type="text" class="search" id="search" placeholder="Rechercher produit ou fournisseur...">
</header>

<div class="container">
<div id="main" class="grid"></div>
<div id="loading" class="loading">Chargement...</div>
</div>

<div class="page" id="categoriesPage"></div>
<div class="page" id="productsPage"></div>

<!-- SOCIAL -->
<div class="social-bar">
<div class="social-btn"><i class="fa-brands fa-whatsapp"></i></div>
<div class="social-btn"><i class="fa-brands fa-facebook-f"></i></div>
<div class="social-btn"><i class="fa-brands fa-youtube"></i></div>
</div>

<!-- DOCK -->
<div class="floating-dock">
<a href="index.html" class="dock-item active">Accueil</a>
<a href="business.html" class="dock-item">Business</a>
<a href="dashbord-soldat.html" class="dock-item">Compte</a>
</div>

<script>

const DATA = [
{
id:1,name:"Chine",city:"Guangzhou",img:"https://images.unsplash.com/photo-1519389950473-47ba0277781c",
categories:[
{name:"Gadgets",products:[{name:"Montre",price:"12$"},{name:"Airpods",price:"5$"}]},
{name:"LED",products:[{name:"Lampe RGB",price:"8$"}]}
]
},
{
id:2,name:"Turquie",city:"Istanbul",img:"https://images.unsplash.com/photo-1523381210434-271e8be1f52b",
categories:[
{name:"Textile",products:[{name:"T-shirt",price:"6$"},{name:"Jogging",price:"10$"}]}
]
}
];

let visible = 0;

function loadMore(){
const container = document.getElementById('main');
const loading = document.getElementById('loading');

for(let i=0;i<2;i++){
if(visible >= DATA.length){loading.innerText="Fin";return}

const s = DATA[visible];

const div = document.createElement('div');
div.className="card";

div.innerHTML=`
<img src="${s.img}">
<div class="card-content">
<b>${s.name}</b>
<div class="meta">📍 ${s.city}</div>
</div>`;

div.onclick=()=>openCategories(s);

container.appendChild(div);
visible++;
}
}

function openCategories(s){
const page = document.getElementById('categoriesPage');

let html = `<h2>${s.name}</h2>`;

s.categories.forEach(c=>{
html+=`
<div class="card" onclick='openProducts(${JSON.stringify(c)})'>
<div class="card-content"><b>${c.name}</b></div>
</div>`;
});

html += `<br><button onclick="closePage('categoriesPage')">Fermer</button>`;

page.innerHTML = html;
page.style.display = 'block';
}

function openProducts(c){
const page = document.getElementById('productsPage');

let html = `<h2>${c.name}</h2>`;

c.products.forEach(p=>{
html+=`<div class="product"><span>${p.name}</span><span class="price">${p.price}</span></div>`;
});

html += `<br><button onclick="closePage('productsPage')">Fermer</button>`;

page.innerHTML = html;
page.style.display = 'block';
}

function closePage(id){
document.getElementById(id).style.display='none';
}

/* SEARCH */
document.getElementById('search').addEventListener('input', e=>{
const value = e.target.value.toLowerCase();
const container = document.getElementById('main');
container.innerHTML='';
visible=0;

DATA.filter(s=>{
return s.name.toLowerCase().includes(value) ||
s.categories.some(c=>
 c.name.toLowerCase().includes(value) ||
 c.products.some(p=>p.name.toLowerCase().includes(value))
);
}).forEach(s=>{
const div=document.createElement('div');
div.className='card';
div.innerHTML=`<img src="${s.img}"><div class="card-content"><b>${s.name}</b></div>`;
div.onclick=()=>openCategories(s);
container.appendChild(div);
});
});

/* LAZY LOAD */
window.addEventListener('scroll',()=>{
if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 100){
loadMore();
}
});

loadMore();

</script>

</body>
</html>
