<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum - After Immersion</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

/* VARIABLES MILITAIRES */
:root {
  --black: #0a0a0a;
  --dark: #121212;
  --gold: #d4af37;
  --gold-light: #f1d77a;
  --text: #eaeaea;
  --gray: #2a2a2a;
  --green-army: #1f3d2b;
}

/* BODY */
body {
  background: var(--black);
  color: var(--text);
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-thumb {
  background: var(--gold);
  border-radius: 10px;
}

.header {
  background: var(--dark);
  padding: 15px;
  text-align: center;
  border-bottom: 2px solid var(--gold);
}

.header h1 {
  color: var(--gold);
  font-size: 18px;
}

/* CONTAINER */
.forum-container {
  padding: 10px;
  max-width: 800px;
  margin: auto;
}

/* SEARCH */
#searchInput {
  width: 100%;
  padding: 10px;
  border-radius: 20px;
  border: none;
  margin-bottom: 10px;
  background: var(--gray);
  color: white;
}

/* CREATE POST */
.create-post {
  background: var(--dark);
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.create-post input,
.create-post textarea,
.create-post select {
  width: 100%;
  margin-bottom: 8px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: var(--gray);
  color: white;
}

/* POSTS */
.post {
  margin-bottom: 15px;
  display: flex;
  flex-direction: column;
}

/* BULLE TYPE WHATSAPP */
.post h3 {
  color: var(--gold);
  margin-bottom: 5px;
}

.post p {
  background: var(--green-army);
  padding: 10px;
  border-radius: 10px;
  max-width: 80%;
  align-self: flex-start;
}

/* META */
.post small {
  font-size: 12px;
  color: var(--gold-light);
  margin-top: 5px;
}

/* COMMENTAIRES */
[id^="comments-"] p {
  background: var(--gray);
  padding: 8px;
  border-radius: 8px;
  margin-top: 5px;
  font-size: 14px;
}

/* INPUT COMMENT */
input[id^="comment-"] {
  margin-top: 5px;
  padding: 8px;
  border-radius: 20px;
  border: none;
  background: var(--dark);
  color: white;
}

/* BUTTON */
button {
  margin-top: 5px;
  padding: 8px;
  border: none;
  border-radius: 20px;
  background: var(--gold);
  color: black;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: var(--gold-light);
}

/* BOUTON VOIR */
.post button:first-of-type {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
}

/* ANIMATION */
.post {
  animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}


</style>

</head>
<body>

<header class="header">
  <h1> Forum de discussion </h1>
</header>

<section class="forum-container">

  <!-- 🔍 Recherche -->
  <input type="text" id="searchInput" placeholder="Rechercher un sujet...">

  <!-- 📂 Catégories -->
  <div id="categories"></div>

  <!-- 📝 Création post -->
  <div class="create-post">
    <input type="text" id="title" placeholder="Titre">
    <textarea id="content" placeholder="Contenu"></textarea>

    <select id="category"></select>

    <button onclick="createPost()">Publier</button>
  </div>

  <!-- 📜 Liste des posts -->
  <div id="posts"></div>

</section>

<script src="assets/js/forum.js"></script>
</body>
</html>
