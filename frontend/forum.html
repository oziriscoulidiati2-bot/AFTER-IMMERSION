<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum - After Immersion</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

/* VARIABLES MILITAIRES */
:root {
  --black: #0a0a0a;
  --dark: #121212;
  --gold: #d4af37;
  --gold-light: #f1d77a;
  --text: #eaeaea;
  --gray: #2a2a2a;
  --green-army: #1f3d2b;
}

/* BODY */
body {
  background: var(--black);
  color: var(--text);
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-thumb {
  background: var(--gold);
  border-radius: 10px;
}

.header {
  background: var(--dark);
  padding: 15px;
  text-align: center;
  border-bottom: 2px solid var(--gold);
}

.header h1 {
  color: var(--gold);
  font-size: 18px;
}

/* CONTAINER */
.forum-container {
  padding: 10px;
  max-width: 800px;
  margin: auto;
}

/* SEARCH */
#searchInput {
  width: 100%;
  padding: 10px;
  border-radius: 20px;
  border: none;
  margin-bottom: 10px;
  background: var(--gray);
  color: white;
}

/* CREATE POST */
.create-post {
  background: var(--dark);
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.create-post input,
.create-post textarea,
.create-post select {
  width: 100%;
  margin-bottom: 8px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: var(--gray);
  color: white;
}

/* POSTS */
.post {
  margin-bottom: 15px;
  display: flex;
  flex-direction: column;
}

/* BULLE TYPE WHATSAPP */
.post h3 {
  color: var(--gold);
  margin-bottom: 5px;
}

.post p {
  background: var(--green-army);
  padding: 10px;
  border-radius: 10px;
  max-width: 80%;
  align-self: flex-start;
}

/* META */
.post small {
  font-size: 12px;
  color: var(--gold-light);
  margin-top: 5px;
}

/* COMMENTAIRES */
[id^="comments-"] p {
  background: var(--gray);
  padding: 8px;
  border-radius: 8px;
  margin-top: 5px;
  font-size: 14px;
}

/* INPUT COMMENT */
input[id^="comment-"] {
  margin-top: 5px;
  padding: 8px;
  border-radius: 20px;
  border: none;
  background: var(--dark);
  color: white;
}

/* BUTTON */
button {
  margin-top: 5px;
  padding: 8px;
  border: none;
  border-radius: 20px;
  background: var(--gold);
  color: black;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: var(--gold-light);
}

/* BOUTON VOIR */
.post button:first-of-type {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
}

/* ANIMATION */
.post {
  animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}


</style>

</head>
<body>

<header class="header">
  <h1> Forum de discussion </h1>
</header>

<section class="forum-container">

  <!-- 🔍 Recherche -->
  <input type="text" id="searchInput" placeholder="Rechercher un sujet...">

  <!-- 📂 Catégories -->
  <div id="categories"></div>

  <!-- 📝 Création post -->
  <div class="create-post">
    <input type="text" id="title" placeholder="Titre">
    <textarea id="content" placeholder="Contenu"></textarea>

    <select id="category"></select>

    <button onclick="createPost()">Publier</button>
  </div>

  <!-- 📜 Liste des posts -->
  <div id="posts"></div>

</section>

<script>
  const API = "https://after-immersion-api.onrender.com/api";
const token = localStorage.getItem("token");

async function loadCategories() {
  const res = await fetch(`${API}/forum/categories`);
  const data = await res.json();

  const select = document.getElementById("category");

  data.forEach(cat => {
    const option = document.createElement("option");
    option.value = cat.id;
    option.textContent = cat.name;
    select.appendChild(option);
  });
}

async function loadPosts(search = "") {
  const res = await fetch(`${API}/forum/posts?search=${search}`);
  const posts = await res.json();

  const container = document.getElementById("posts");
  container.innerHTML = "";

  posts.forEach(post => {
    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <h3>${post.title}</h3>
      <p>${post.content}</p>
      <small>${post.nom} - ${post.category}</small>
      <button onclick="loadComments(${post.id})">Voir</button>

      <div id="comments-${post.id}"></div>
      <input type="text" id="comment-${post.id}" placeholder="Commenter...">
      <button onclick="addComment(${post.id})">Envoyer</button>
    `;

    container.appendChild(div);
  });
}

async function createPost() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;
  const category_id = document.getElementById("category").value;

  await fetch(`${API}/forum/posts`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${token}`
    },
    body: JSON.stringify({ title, content, category_id })
  });

  loadPosts();
}

async function loadComments(postId) {
  const res = await fetch(`${API}/forum/comments/${postId}`);
  const comments = await res.json();

  const container = document.getElementById(`comments-${postId}`);
  container.innerHTML = "";

  comments.forEach(c => {
    container.innerHTML += `<p><b>${c.nom}</b>: ${c.content}</p>`;
  });
}

async function addComment(postId) {
  const content = document.getElementById(`comment-${postId}`).value;

  await fetch(`${API}/forum/comments`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${token}`
    },
    body: JSON.stringify({ post_id: postId, content })
  });

  loadComments(postId);
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  loadPosts(e.target.value);
});

loadCategories();
loadPosts();
</script>
</body>
</html>
