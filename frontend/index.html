<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>After Immersion Learning (Auto)</title>
<style>
body{font-family:Arial;background:#0d0d0d;color:#fff;margin:0}
header{padding:1rem;background:#000;text-align:center;border-bottom:3px solid orange}
.container{padding:1rem;max-width:1100px;margin:auto}
h2{color:orange}
.level{margin-bottom:2rem}
.video-card{background:#1a1a1a;padding:1rem;margin-bottom:1rem;border-left:5px solid red;border-radius:6px}
iframe{width:100%;height:240px;border:none;margin-bottom:1rem}
.qcm button{display:block;width:100%;margin:6px 0;padding:10px;border:none;cursor:pointer;background:#333;color:#fff;border-radius:4px}
.qcm button.correct{background:green}
.qcm button.wrong{background:red}
.locked{opacity:.35;pointer-events:none}
#progressBar{background:#333;height:20px;margin:10px 0;border-radius:10px;overflow:hidden}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,#00c853,#64dd17)}
.dashboard{background:#111;padding:1rem;margin-bottom:1rem;border-radius:6px}
.badges span{background:#222;padding:.4rem .6rem;margin-right:.4rem;border-radius:4px;border:1px solid #333}
</style>
</head>
<body>
<header>
  <h1>🪖 After Immersion Business Training</h1>
</header>
<div class="container">
  <div class="dashboard">
    <p>⭐ Points: <span id="points">0</span></p>
    <div id="progressBar"><div id="progressFill"></div></div>
    <p>🎖️ Grade: <span id="grade">Recrue</span></p>
    <div class="badges" id="badges"></div>
  </div>

  <div id="app"></div>
</div>

<script>
// ===================== DATA (EDIT ICI) =====================
const DATA = [
  {
    id: 'n1',
    title: 'Niveau 1 - Marketing',
    unlockBy: [],
    items: [
      {
        id: 'q1',
        youtubeId: '3JZ_D3ELwOQ',
        question: 'Quelle est la base du marketing ?',
        answers: [
          {text:'Vendre directement', correct:false},
          {text:'Comprendre le client', correct:true},
          {text:'Faire publicité', correct:false}
        ]
      },
      {
        id: 'q2',
        youtubeId: '2Vv-BfVoq4g',
        question: 'Le marketing digital concerne surtout ?',
        answers: [
          {text:'Internet', correct:true},
          {text:'Radio', correct:false},
          {text:'Télé', correct:false}
        ]
      }
    ]
  },
  {
    id: 'n2',
    title: 'Niveau 2 - Vente',
    unlockBy: ['q1','q2'],
    items: [
      {
        id: 'q3',
        youtubeId: 'kJQP7kiw5Fk',
        question: 'Quel est le but de la vente ?',
        answers: [
          {text:'Satisfaire le client', correct:true},
          {text:'Forcer le client', correct:false},
          {text:'Ignorer le besoin', correct:false}
        ]
      }
    ]
  }
];

// ===================== STATE =====================
let points = parseInt(localStorage.getItem('points')) || 0;
let completed = JSON.parse(localStorage.getItem('completed')) || {}; // {q1:true,...}

// ===================== HELPERS =====================
function totalQCM(){
  return DATA.reduce((acc, lvl)=> acc + lvl.items.length, 0);
}

function isLevelUnlocked(level){
  return level.unlockBy.every(id => completed[id]);
}

function gradeFromPoints(p){
  if(p >= 60) return 'Officier';
  if(p >= 30) return 'Soldat';
  return 'Recrue';
}

function badgesFromState(){
  const b = [];
  if(completed['q1'] && completed['q2']) b.push('🎯 Marketing validé');
  if(completed['q3']) b.push('💰 Vente validée');
  if(Object.keys(completed).length === totalQCM()) b.push('🏆 Tout complété');
  return b;
}

function save(){
  localStorage.setItem('points', points);
  localStorage.setItem('completed', JSON.stringify(completed));
}

// ===================== RENDER =====================
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  DATA.forEach(level => {
    const section = document.createElement('div');
    section.className = 'level' + (isLevelUnlocked(level) ? '' : ' locked');

    const h2 = document.createElement('h2');
    h2.textContent = level.title + (isLevelUnlocked(level) ? '' : ' 🔒');
    section.appendChild(h2);

    level.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'video-card';

      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${item.youtubeId}`;
      card.appendChild(iframe);

      const qcm = document.createElement('div');
      qcm.className = 'qcm';

      const p = document.createElement('p');
      p.textContent = item.question;
      qcm.appendChild(p);

      item.answers.forEach(ans => {
        const btn = document.createElement('button');
        btn.textContent = ans.text;

        // restore state
        if(completed[item.id]){
          btn.disabled = true;
          if(ans.correct) btn.classList.add('correct');
        }

        btn.onclick = () => handleAnswer(item.id, ans.correct, qcm, btn);
        qcm.appendChild(btn);
      });

      card.appendChild(qcm);
      section.appendChild(card);
    });

    app.appendChild(section);
  });

  updateDashboard();
}

function updateDashboard(){
  document.getElementById('points').innerText = points;
  const progress = (Object.keys(completed).length / totalQCM()) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('grade').innerText = gradeFromPoints(points);

  const badgesEl = document.getElementById('badges');
  badgesEl.innerHTML = '';
  badgesFromState().forEach(b => {
    const span = document.createElement('span');
    span.textContent = b;
    badgesEl.appendChild(span);
  });
}

// ===================== LOGIC =====================
function handleAnswer(id, isCorrect, qcmEl, clickedBtn){
  if(completed[id]) return;

  const buttons = qcmEl.querySelectorAll('button');
  buttons.forEach(btn => {
    btn.disabled = true;
    // mark clicked
    if(btn === clickedBtn){
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  });

  // mark the correct one
  const idx = Array.from(buttons).findIndex((_,i)=>{
    // we don't have direct mapping here; re-evaluate from DATA
    return DATA.some(l => l.items.some(it => it.id===id && it.answers[i] && it.answers[i].correct));
  });
  if(idx >= 0 && buttons[idx]) buttons[idx].classList.add('correct');

  completed[id] = true;
  points += isCorrect ? 10 : 5;
  save();
  render();
}

// init
render();
</script>
</body>
</html>
