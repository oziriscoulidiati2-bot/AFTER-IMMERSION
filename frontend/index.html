<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeune§riche</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ================= HEADER ================= */

.app-header{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);

width:95%;
max-width:500px;

display:flex;
justify-content:space-between;
align-items:center;

padding:10px 14px;

background:rgba(20,20,25,0.9);
backdrop-filter:blur(10px);

border-radius:50px;
border:1px solid #222;

z-index:6000;
}

/* left */
.header-left{
display:flex;
align-items:center;
gap:8px;
}

.logo{
font-size:18px;
}

.site-name{
font-size:14px;
font-weight:bold;
}

/* ================= BURGER ================= */

.burger{
width:40px;
height:40px;

border-radius:50%;
border:none;

background:#1c1c25;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:4px;

cursor:pointer;
}

.burger span{
width:18px;
height:2px;
background:white;
border-radius:2px;
}

.burger:active{
transform:scale(0.9);
}
/* ================= MENU ================= */

.menu-overlay{
position:fixed;
inset:0;

background:rgba(0,0,0,0.6);

display:none;
justify-content:center;
align-items:center;

z-index:7000;
}

.menu-box{
width:80%;
max-width:400px;

height:50%;
max-height:400px;

background:#141420;

border-radius:20px;
padding:20px;

display:flex;
flex-direction:column;
gap:12px;

animation:fadeIn 0.3s ease;
}

.menu-box a{
text-decoration:none;
color:white;
padding:10px;
border-radius:10px;
background:#1c1c25;
}

.menu-box a:hover{
background:#00c853;
color:black;
}

/* animation */
@keyframes fadeIn{
from{
opacity:0;
transform:scale(0.9);
}
to{
opacity:1;
transform:scale(1);
}
}

/* ================= DESKTOP ================= */

@media(min-width:768px){

.app-header{
max-width:700px;
}

.menu-box{
width:400px;
height:400px;
}

}
/* ================= SOCIAL BAR ================= */

.social-bar{
position:fixed;
right:10px;
top:50%;
transform:translateY(-50%);
display:flex;
flex-direction:column;
gap:10px;
z-index:6000;
}

.social-btn{
background:#1c1c25;
border:1px solid #333;
padding:10px;
border-radius:12px;
color:white;
text-decoration:none;
font-size:14px;
text-align:center;
transition:0.3s;
}

.social-btn:hover{
background:#00c853;
color:black;
transform:scale(1.1);
}


body{
margin:0;
font-family:Arial;
background:#0b0b0f;
color:white;
overflow-x:hidden;
}

.topbar{
position:fixed;
top:70px;
left:0;
right:0;
z-index:500;
background:#0f0f14;
padding:10px;
border-bottom:1px solid #222;
}

.progress-container{
background:#222;
height:6px;
border-radius:20px;
overflow:hidden;
margin-top:6px;
}

.progress-fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00c853,#64dd17);
transition:0.3s;
}

.badges{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:6px;
font-size:12px;
}

.badge{
background:#1c1c25;
padding:4px 8px;
border-radius:20px;
border:1px solid #333;
}

.container{padding-top:90px}

.level-scroll{
display:flex;
overflow-x:auto;
gap:12px;
padding:10px;
scroll-snap-type:x mandatory;
}

.level-card{
min-width:280px;
background:#141420;
border-radius:16px;
overflow:hidden;
scroll-snap-align:start;
position:relative;
cursor:pointer;
opacity:1;
}

.level-card.locked{
opacity:0.3;
pointer-events:none;
}

.level-image{
width:100%;
height:140px;
object-fit:cover;
background:#222;
}

.level-content{padding:10px}

.lock-badge{
position:absolute;
top:10px;
right:10px;
background:red;
padding:4px 8px;
border-radius:10px;
font-size:11px;
}

.level-page,.mission-view{
position:fixed;
inset:0;
background:#0b0b0f;
z-index:2000;
overflow-y:auto;
display:none;
padding:15px;
}

.book-item{
background:#151520;
padding:10px;
border-radius:10px;
margin-top:8px;
cursor:pointer;
}

.free-btn{
margin-top:10px;
padding:10px;
background:#00c853;
border:none;
border-radius:8px;
color:black;
font-weight:bold;
}

.video{
width:100%;
height:220px;
border:none;
border-radius:12px;
margin-top:10px;
}

.qcm button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
background:#1c1c25;
color:white;
cursor:pointer;
}

.closeBtn{
background:#d50000;
color:white;
padding:10px;
border:none;
border-radius:8px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#0f0f14;
display:flex;
justify-content:space-around;
padding:10px;
border-top:1px solid #222;
z-index:4000;
}

.menu-dropdown{
position:fixed;
bottom:60px;
left:0;
right:0;
background:#111;
display:none;
padding:10px;
z-index:4500;
}

.social-bar{
position:fixed;
right:15px;
bottom:80px; /* mobile first */
display:flex;
flex-direction:column;
gap:12px;
z-index:6000;
}

/* version desktop */
@media(min-width:768px){
.social-bar{
top:50%;
bottom:auto;
transform:translateY(-50%);
}
}

.social-btn{
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;

background:rgba(28,28,37,0.8);
backdrop-filter:blur(10px);

border:1px solid #333;
border-radius:20%; /* rond parfait */

color:white;
text-decoration:none;
font-size:20px;

transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.social-btn:hover{
background:#00c853;
color:black;
transform:scale(1.15);
}

.social-btn i{
font-size:20px;
}

/* ================= MOBILE FIRST (BASE) ================= */

.floating-dock{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);

display:flex;
gap:10px;

background:rgba(20,20,25,0.9);
backdrop-filter:blur(10px);

padding:10px;
border-radius:50px;

box-shadow:0 10px 25px rgba(0,0,0,0.4);
z-index:5000;

/* important mobile fix */
max-width:95%;
overflow-x:auto;
white-space:nowrap;
scrollbar-width:none;
}

/* hide scrollbar mobile */
.floating-dock::-webkit-scrollbar{
display:none;
}

.dock-item{
display:flex;
align-items:center;
gap:6px;

padding:10px 14px;
border-radius:30px;

text-decoration:none;
color:white;
font-size:14px;

transition:0.2s;

flex:0 0 auto; /* important mobile scroll */
white-space:nowrap;
}

.dock-item:hover{
background:#00c853;
color:black;
transform:scale(1.05);
}

.dock-item.active{
background:#00c853;
color:black;
}

@media(min-width:768px){

.floating-dock{
left:50%;
transform:translateX(-50%);
bottom:20px;

max-width:none;
overflow:visible;
}

}

.qcm button{
transition:0.2s;
}
</style>
</head>

<body>

<header class="app-header">

<div class="header-left">
<div class="logo">🎮</div>
<span class="site-name">Jeune§riche</span>
</div>

<button class="burger" onclick="toggleMenu()">
<span></span>
<span></span>
<span></span>
</button>

</header>

<!-- MENU POPUP -->
<div class="menu-overlay" id="menuOverlay" onclick="closeMenu(event)">
<div class="menu-box">

<h3>Menu</h3>

<a href="#">Accueil</a>
<a href="#">Niveaux</a>
<a href="#">Business</a>
<a href="#">Profil</a>
<a href="#">Paramètres</a>

</div>

</div>

<div class="topbar">
<div>Points: <span id="points">0</span> | Grade: <span id="grade">Recrue</span></div>
<div class="progress-container">
<div class="progress-fill" id="progress"></div>
</div>
<div class="badges" id="badges"></div>
</div>

<br>
<br>
<br>
<br>

<div class="container">
<div class="level-scroll" id="levels"></div>

<br>

<div style="padding:10px;">

<div class="level-card" onclick="openImmersion()">
<img class="level-image" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">

<div class="level-content">
<h3>Immersion Patriotique </h3>
<p>Promotion 2025</p>
</div>

</div>

</div>
</div>

<div class="level-page" id="levelPage">
<div id="levelContent"></div>
<br>
<button class="closeBtn" onclick="closeLevel()">Fermer</button>
</div>

<div class="mission-view" id="missionView">
<br>
<br>
<br>
<div id="missionContent"></div>
<br>
<button class="closeBtn" onclick="closeMission()">Fermer</button>
</div>
<br>
<br>
<br>
<div class="floating-dock">

<a href="propos.html" class="dock-item active" onclick="setActiveDock(this)">
🏠 <span>A propos</span>
</a>

<a href="Business.html" class="dock-item" onclick="openImmersion(); setActiveDock(this)">
🌍 <span>Business</span>
</a>

<a href="dashbord-soldat.html" class="dock-item" onclick="setActiveDock(this)">
👤 <span>compte</span>
</a>

</div>

<div class="menu-dropdown" id="menu">
<p>Accueil</p>
<p>Profil</p>
<p>Paramètres</p>
</div>


<div class="social-bar">

<a href="https://tiktok.com" target="_blank" class="social-btn">
<i class="fa-brands fa-tiktok"></i>
</a>

<a href="https://facebook.com" target="_blank" class="social-btn">
<i class="fa-brands fa-facebook-f"></i>
</a>

<a href="https://www.youtube.com/@immerg%C3%A9s" target="_blank" class="social-btn">
<i class="fa-brands fa-youtube"></i>
</a>

<a href="https://wa.me/22650854781" target="_blank" class="social-btn">
<i class="fa-brands fa-whatsapp"></i>
</a>

<a href="tel:+22650854781" class="social-btn">
<i class="fa-solid fa-phone"></i>
</a>

</div>

<div class="level-page" id="immersionPage">
<button class="closeBtn" onclick="closeImmersion()">Fermer</button>
<div id="immersionContent"></div>
</div>

<script async src="https://www.tiktok.com/embed.js"></script>

<script>

/* ================= DATA ================= */

const DATA = [

{
id:'l1',
name:'Marketing',
img:'https://images.unsplash.com/photo-1556761175-4b46a572b786',
missions:[
{
id:'m1',
title:'Intro Marketing',
videos:[
{id:'3JZ_D3ELwOQ', qcm:{
q:'C’est quoi le marketing ?',
a:[
{t:'Créer de la valeur pour le client', c:true},
{t:'Vendre au hasard', c:false},{t:'Créer de la valeur pour le client', c:false} ,{t:'Créer de la valeur pour le client', c:false}
]
}}
]
},
{
id:'m2',
title:'Stratégie',
videos:[
{id:'3JZ_D3ELwOQ', qcm:{
q:'Objectif principal ?',
a:[
{t:'Satisfaire le client', c:true},
{t:'Perdre de l’argent', c:false}
]
}}
]
}
]
},
{
id:'l2',
name:'Success',
img:'https://images.unsplash.com/photo-1556761175-4b46a572b786',
missions:[
{
id:'m1',
title:'Mindset',
videos:[
{id:'3JZ_D3ELwOQ', qcm:{
q:'Le succès dépend de ?',
a:[
{t:'Discipline', c:true},
{t:'Chance uniquement', c:false}
]
}}
]
}
]
}
];

const IMMERSION = {

tiktoks:[
'https://www.tiktok.com/@scout2015/video/6718335390845095173'
],

posts:[
{
img:'https://images.unsplash.com/photo-1529107386315-e1a2ed48a620',
desc:'La discipline est la base d’une nation forte.'
},
{
img:'https://images.unsplash.com/photo-1506744038136-46273834b3fb',
desc:'hhoijpokop.'
}
]

};

/* ================= STATE ================= */

let points = +localStorage.getItem('points') || 0;
let done = JSON.parse(localStorage.getItem('done')) || {};
let doneLevels = JSON.parse(localStorage.getItem('doneLevels')) || {};
let badges = JSON.parse(localStorage.getItem('badges')) || [];

/* ================= NOTIFICATION SYSTEM ================= */

function notify(msg){
const n = document.createElement('div');
n.innerText = msg;
n.style.position = "fixed";
n.style.top = "20px";
n.style.right = "20px";
n.style.background = "#1c1c25";
n.style.color = "white";
n.style.padding = "10px 15px";
n.style.border = "1px solid #00c853";
n.style.borderRadius = "10px";
n.style.zIndex = 9999;
n.style.boxShadow = "0 0 15px rgba(0,200,83,0.4)";
document.body.appendChild(n);

setTimeout(()=>n.remove(), 2000);
}

/* ================= GAME LOGIC ================= */

function isLevelUnlocked(index){
return points >= index * 50;
}

function isLevelCompleted(level){
return level.missions.every(m => done[m.id]);
}

function grade(){
if(points >= 100) return "Officier";
if(points >= 50) return "Soldat";
return "Recrue";
}

/* ================= UPDATE ================= */

function update(){
document.getElementById('points').innerText = points;
document.getElementById('grade').innerText = grade();
updateProgress();
renderBadges();
save();
}

function updateProgress(){
let max = 100;
let pct = Math.min((points / max) * 100, 100);
document.getElementById('progress').style.width = pct + '%';
}

/* ================= SAVE ================= */

function save(){
localStorage.setItem('points', points);
localStorage.setItem('done', JSON.stringify(done));
localStorage.setItem('doneLevels', JSON.stringify(doneLevels));
localStorage.setItem('badges', JSON.stringify(badges));
}

/* ================= BADGES ================= */

function addBadge(name){
if(badges.includes(name)) return;
badges.push(name);
notify("🏅 Badge obtenu : " + name);
}

/* ================= RENDER BADGES ================= */

function renderBadges(){
const el = document.getElementById('badges');
el.innerHTML = '';
badges.forEach(b=>{
let div = document.createElement('div');
div.className='badge';
div.innerText=b;
el.appendChild(div);
});
}

/* ================= LEVELS ================= */

function render(){
const el = document.getElementById('levels');
el.innerHTML = '';

DATA.forEach((l,i)=>{
const unlocked = isLevelUnlocked(i);
const completed = isLevelCompleted(l);

const div = document.createElement('div');

div.className =
'level-card ' +
(unlocked ? '' : 'locked ') +
(completed ? 'completed' : '');

div.innerHTML = `
<img class="level-image" src="${l.img}">
<div class="level-content">
<h3>${l.name}</h3>
</div>
${completed ? '<div class="lock-badge" style="background:#00c853">🏁 TERMINÉ</div>'
: (!unlocked ? '<div class="lock-badge">LOCK</div>' : '')}
`;

div.onclick = () => openLevel(l.id);

el.appendChild(div);
});
}

/* ================= LEVEL PAGE ================= */

function openLevel(id){
const level = DATA.find(l => l.id === id);

document.getElementById('levelPage').style.display = 'block';

let html = `<h2>${level.name}</h2>`;
html += `<div class="book-item">Livre Business</div>`;

level.missions.forEach(m=>{
html += `<div class="book-item" onclick="openMission('${level.id}','${m.id}')">${m.title}</div>`;
});

document.getElementById('levelContent').innerHTML = html;
}

function closeLevel(){
document.getElementById('levelPage').style.display = 'none';
}

/* ================= MISSION ================= */

function openMission(lid, mid){
const level = DATA.find(l => l.id === lid);
const mission = level.missions.find(m => m.id === mid);

let html = `<h2>${mission.title}</h2>`;

mission.videos.forEach(v=>{
html += `
<iframe class="video" src="https://www.youtube.com/embed/${v.id}"></iframe>
<div class="qcm">
<p>${v.qcm.q}</p>
`;

v.qcm.a.forEach(a=>{
html += `<button onclick="ans(this, ${a.c}, '${mid}', '${lid}')">${a.t}</button>`;
});

html += `</div>`;
});

document.getElementById('missionContent').innerHTML = html;
document.getElementById('missionView').style.display = 'block';
}

function toggleMenu(){
const menu = document.getElementById('menu');

if(!menu) return;

menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

function closeMission(){
document.getElementById('missionView').style.display = 'none';
}

/* ================= ANSWERS ================= */

function ans(btn, correct, mid, lid){

const box = btn.closest('.qcm');
const allBtns = box.querySelectorAll('button');

/* éviter double clic */
if(box.dataset.locked) return;
box.dataset.locked = true;

/* désactiver tous les boutons */
allBtns.forEach(b=>{
b.style.pointerEvents = "none";
});

/* trouver la bonne réponse */
let correctBtn = null;

/* si clic correct */
if(correct){

btn.style.background = "#00c853";
btn.style.color = "black";

points += 10;
done[mid] = true;

notify("+10 points");

} 
else {

/* clic faux */
btn.style.background = "#d50000";

/* chercher la bonne réponse */
allBtns.forEach(b=>{
if(b.onclick && b.onclick.toString().includes("true")){
correctBtn = b;
}
});

/* afficher bonne réponse en vert */
if(correctBtn){
correctBtn.style.background = "#00c853";
correctBtn.style.color = "black";
}

notify("Mauvaise réponse");
}

/* check level completion */
const level = DATA.find(l => l.id === lid);

if(isLevelCompleted(level) && !doneLevels[lid]){
doneLevels[lid] = true;
notify("🏁 Niveau terminé !");
addBadge("Level Completed");
}

update();
}

/* ================= INIT ================= */

update();
render();

//section immersion fonction 
function openImmersion(){

document.getElementById('immersionPage').style.display = 'block';

let html = `<h2>🇧🇫 Immersion Patriotique</h2>`;

/* ===== TIKTOK ===== */
IMMERSION.tiktoks.forEach(link=>{
html += `
<blockquote class="tiktok-embed" cite="${link}"></blockquote>
`;
});

/* ===== POSTS ===== */
IMMERSION.posts.forEach(p=>{
html += `
<div class="book-item">
<img src="${p.img}" style="width:100%;border-radius:10px;">
<p>${p.desc}</p>
</div>
`;
});

document.getElementById('immersionContent').innerHTML = html;
}

function closeImmersion(){
document.getElementById('immersionPage').style.display = 'none';
}

function setActiveDock(el){

document.querySelectorAll('.dock-item').forEach(item=>{
item.classList.remove('active');
});

el.classList.add('active');
}

//menu
function toggleMenu(){
const menu = document.getElementById('menuOverlay');
menu.style.display = 'flex';
}

function closeMenu(e){
if(e.target.id === 'menuOverlay'){
document.getElementById('menuOverlay').style.display = 'none';
}
}

document.addEventListener("keydown", e=>{
if(e.key === "Escape"){
document.getElementById('menuOverlay').style.display = 'none';
}
});

</script>

</body>
</html>
