  function shuffle(array){
  let arr = [...array];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ================= QCM ================= */

function startQCM(){
  state.qIndex = 0;
  showQCM();
}

function showQCM(){

  const qcm = chapters["Chapitre 1"].qcm;
  const q = qcm[state.qIndex];

  // 🔥 on mélange les options MAIS on garde la bonne réponse
  const shuffled = shuffle(
    q.options.map((text, index) => ({
      text,
      index
    }))
  );

  // on stocke la bonne réponse mélangée
  state.currentCorrect = shuffled.findIndex(o => o.index === q.answer);

  app.innerHTML = `
  <div class="card">

    <h3>Q${state.qIndex + 1}: ${q.question}</h3>

    ${shuffled.map((o,i)=>`
      <div class="option" onclick="answer(${i})">
        ${o.text}
      </div>
    `).join("")}

    <p>XP: +${q.xp}</p>

  </div>`;
}

/* ================= ANSWER ================= */

function answer(choice){

  const qcm = chapters["Chapitre 1"].qcm;
  const q = qcm[state.qIndex];

  const options = document.querySelectorAll(".option");

  if(choice === state.currentCorrect){
    options[choice].classList.add("good");
    addXP(q.xp);
  }
  else {
    options[choice].classList.add("bad");
    options[q.answer].classList.add("good");
  }

  setTimeout(()=>{
    state.qIndex++;

    if(state.qIndex >= qcm.length){
      notify("Chapitre terminé 🎉");
      home();
    } else {
      showQCM();
    }

  }, 800);
 
}

  
  
/* ================= XP SYSTEM ================= */

function addXP(points){

  state.xp += points;

  if(state.xp >= state.level * 100){
    state.level++;
    notify("🔥 LEVEL UP !", "success");
  }

  localStorage.setItem("xp", state.xp);
  localStorage.setItem("level", state.level);
}
/* ================= ESSAYS ================= */

function getEssayProgress(){
  return JSON.parse(localStorage.getItem("essayProgress")) || {};
}

function saveEssayProgress(title, content){

  const progress = getEssayProgress();

  progress[title] = {
    content: content,
    done: true,
    updatedAt: new Date().toISOString()
  };

  localStorage.setItem(
    "essayProgress",
    JSON.stringify(progress)
  );
}

function essayMenu(){

  const essays = chapters["Chapitre 1"].essays;
  const progress = getEssayProgress();

  app.innerHTML = `
  <div class="card">

    <h2>✍️ Devoirs</h2>

    ${essays.map((e,i)=>{

      const done = progress[e.title];

      return `
      <button
        onclick="startEssay(${i})"
        style="
          background:${done ? '#22c55e' : '#3b82f6'};
        "
      >
        ${done ? '✅' : '📝'}
        ${e.title}
      </button>
      `;
    }).join("")}

  <br>
  
  <br>
  <button onclick="home()">
      ⬅️ Retour
    </button>

  </div>`;
}

function startEssay(i){

  const essay = chapters["Chapitre 1"].essays[i];

  state.essay = essay;
  state.timer = essay.time;

  clearInterval(state.interval);

  state.interval = setInterval(()=>{

    state.timer--;

    if(state.timer <= 0){

      clearInterval(state.interval);

      autoSaveEssay();

      notify("⏰ Temps écoulé !");
    }

    updateTimer();

  },1000);

  renderEssay();
}

function autoSaveEssay(){

  const textarea = document.getElementById("essayText");

  if(!textarea) return;

  saveEssayProgress(
    state.essay.title,
    textarea.value
  );
}

function liveSaveEssay(){

  const text =
    document.getElementById("essayText").value;

  saveEssayProgress(
    state.essay.title,
    text
  );
}

function finishEssay(){

  clearInterval(state.interval);

  const text =
    document.getElementById("essayText").value;

  saveEssayProgress(
    state.essay.title,
    text
  );

  addXP(state.essay.xp);

  notify("Devoir enregistré !");

  essayMenu();
}

function resetEssay(){

  const progress = getEssayProgress();

  delete progress[state.essay.title];

  localStorage.setItem(
    "essayProgress",
    JSON.stringify(progress)
  );

  renderEssay();
}

function updateTimer(){

  const timer = document.getElementById("timer");
  const fill = document.getElementById("fill");

  const minutes =
    Math.floor(state.timer / 60);

  const seconds =
    state.timer % 60;

  const formatted =
    `${minutes}:${seconds
      .toString()
      .padStart(2,"0")}`;

  if(timer){
    timer.innerHTML = `⏱️ ${formatted}`;
  }

  if(fill){
    fill.style.width =
      `${(state.timer/state.essay.time)*100}%`;
  }
}
/* ================= ESSAY UI ================= */

function renderEssay(){

  const progress = getEssayProgress();

  const oldAnswer =
    progress[state.essay.title]?.content || "";

  app.innerHTML = `
  
  
  <div class="card">

    <h3>${state.essay.title}</h3>

    <div class="bar">
      <div
        class="fill"
        id="fill"
        style="
          width:${(state.timer/state.essay.time)*100}%
        ">
      </div>
    </div>

    <p id="timer"></p>

    <p>
      ${state.essay.question}
    </p>

    <textarea
      id="essayText"
      placeholder="Rédige ta réponse..."
      oninput="liveSaveEssay()"
    >${oldAnswer}</textarea>

  <button onclick="sendEssay()">
    🤖 Corriger avec IA
  </button>
  
    <button onclick="finishEssay()">
      Enregister le devoir
    </button>

    <button onclick="resetEssay()">
       Refaire le devoir 
    </button>
  
  <br>
  
  <br>
  
  <br>
    <button onclick="essayMenu()">
      ⬅️ Retour
    </button>

  </div>`;
}



/* ================= SEND IA ================= */

function sendEssay(){

  const text = document.getElementById("essayText").value;

  if(!text.trim()){
    alert("Écris quelque chose !");
    return;
  }

  const prompt = `
Corrige ce devoir :

QUESTION:
${state.essay.question}

REPONSE:
${text}

Donne:
- note /20
- erreurs
- correction
`;

  window.open("https://chatgpt.com/?q=" + encodeURIComponent(prompt));
}

/* ================= INIT ================= */

home();
  
  function notify(message, type="info", duration=3500){

  const container = document.getElementById("notif-container");

  const div = document.createElement("div");
  div.className = `notif ${type}`;
  div.innerText = message;

  container.appendChild(div);

  setTimeout(()=>{
    div.remove();
  }, duration);
}

  
  
  function quitQCM(){
  state.qIndex = 0;
  home();
}
  
</script>
