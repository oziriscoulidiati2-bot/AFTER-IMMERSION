/* ================= CHAPTERS MAP ================= */

const chapters={
  "P1 — Intro : La cellule": chapterCelluleIntro,
  "P1 — Ch.I : Organisation cellulaire": chapterOrganisationCellule,
  "P1 — Ch.II : Vie cellulaire": chapterVieCellulaire,
  "P2 — Ch.I : Anatomie génitale": chapterAnatomieGenitaux,
  "P2 — Ch.II : Physiologie reproduction": chapterPhysiologieReproduction,
  "P3 — Ch.I : Variation": chapterVariation,
  "P3 — Ch.II : Lois de Mendel": chapterMendel,
  "P3 — Ch.III : Travaux de Morgan": chapterMorgan,
  "P3 — Ch.IV : Hérédité humaine": chapterHerediteHumaine,
  "P4 — Ch.I : Tissu nerveux": chapterTissuNerveux,
  "P4 — Ch.II : Système nerveux": chapterSystemeNerveux,
  "P5 — Ch.I : Activité cardiaque": chapterActiviteCardiaque,
  "P5 — Ch.II : Relations humorales": chapterRelationsHumorales,
  "P5 — Ch.III : Milieu intérieur": chapterMilieuInterieur,
  "P5 — Ch.IV : Immunologie": chapterImmunologie
};

/* ================= HOME ================= */

function home(){
  const trimestres={
    "1er trimestre":["P1 — Intro : La cellule","P1 — Ch.I : Organisation cellulaire","P1 — Ch.II : Vie cellulaire","P2 — Ch.I : Anatomie génitale","P2 — Ch.II : Physiologie reproduction","P3 — Ch.I : Variation"],
    "2ème trimestre":["P3 — Ch.II : Lois de Mendel","P3 — Ch.III : Travaux de Morgan","P3 — Ch.IV : Hérédité humaine","P4 — Ch.I : Tissu nerveux"],
    "3ème trimestre":["P4 — Ch.II : Système nerveux","P5 — Ch.I : Activité cardiaque","P5 — Ch.II : Relations humorales","P5 — Ch.III : Milieu intérieur","P5 — Ch.IV : Immunologie"]
  };

  let html=`<div class="card"><h2>🌿 SVT — Terminale D</h2>
  <button class="mission-btn" onclick="startMission()">⚡ MODE MISSION COMMANDO</button><br><br>`;

  Object.keys(trimestres).forEach(tri=>{
    html+=`<p style="color:#86efac;font-weight:bold;margin-top:15px;"> ${tri}</p>`;
    trimestres[tri].forEach(ch=>{
      html+=`<button onclick="openChapter('${ch}')" style="text-align:left;font-size:13px;">${ch}</button>`;
    });
  });

  html+=`<button onclick="essayMenu()" style="margin-top:20px;">✍️ Devoirs écrits</button>
  <p style="color:#94a3b8;font-size:13px;text-align:center;margin-top:10px;">XP: ${state.xp} | Niveau: ${state.level}</p>
  </div>`;

  app.innerHTML=html;
}

/* ================= OPEN CHAPTER ================= */

function openChapter(chapter){
  state.currentChapter=chapter;
  const data=chapters[chapter];

  app.innerHTML=`
  <div class="card">
    <span class="trimestre-tag">${data.trimestre}</span>
    <h2 style="font-size:16px;">${chapter}</h2>
    <button onclick="showCours('${chapter}')">📖 Voir le cours</button>
    <button onclick="startQCM()">🎯 Start QCM</button>
    <button class="quit-btn" onclick="home()"> Quitter</button>
  </div>`;
}

/* ================= COURS ================= */

function showCours(chapter){
  const cours=chapters[chapter].cours;
  if(!cours){notify("Cours bientôt disponible !","info");return;}

  app.innerHTML=`
  <div class="card">
    <h2>📖 ${chapter}</h2>
    <p style="line-height:1.7;color:#cbd5e1;">${cours.texte}</p>
    <div style="margin-top:15px;">
      ${cours.exemples.map(ex=>`
        <div style="background:#1e293b;border-left:3px solid #16a34a;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px;color:#e2e8f0;line-height:1.5;">${ex}</div>
      `).join("")}
    </div>
    <button onclick="startQCM()" style="margin-top:20px;">🎯 Démarrer le QCM</button>
    <button class="quit-btn" onclick="openChapter('${chapter}')">← Retour</button>
  </div>`;
}

/* ================= QCM ================= */

function startQCM(){
  state.qIndex=0;
  state.qcmScore=0;
  state.qcmTotal=0;
  showQCM();
}

function showQCM(){
  const qcm=chapters[state.currentChapter].qcm;
  const q=qcm[state.qIndex];
  const shuffled=shuffle(q.options.map((text,index)=>({text,index})));
  state.currentCorrect=shuffled.findIndex(o=>o.index===q.answer);

  app.innerHTML=`
  <div class="card">
    <h3 style="font-size:15px;">Q${state.qIndex+1}/${qcm.length} : ${q.question}</h3>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <p id="qcmTimer" style="color:#f87171;font-weight:bold;margin:0;">⏳ 30s</p>
      <span style="font-size:12px;color:#86efac;">✅ ${state.qcmScore}/${state.qcmTotal}</span>
    </div>
    ${shuffled.map((o,i)=>`<div class="option" onclick="answer(${i})">${o.text}</div>`).join("")}
    <p style="color:#94a3b8;font-size:12px;">XP: +${q.xp}</p>
    <button class="quit-btn" onclick="quitQCM()"> Quitter</button>
  </div>`;

  clearInterval(state.qcmTimer);
  state.qcmTimeLeft=30;
  state.qcmTimer=setInterval(()=>{
    state.qcmTimeLeft--;
    const t=document.getElementById("qcmTimer");
    if(t) t.innerHTML=`⏳ ${state.qcmTimeLeft}s`;
    if(state.qcmTimeLeft<=0){
      clearInterval(state.qcmTimer);
      state.qcmTotal++;
      state.qIndex++;
      if(state.qIndex>=qcm.length){showQCMResult();}else{showQCM();}
    }
  },1000);
}

function answer(choice){
  const qcm=chapters[state.currentChapter].qcm;
  const q=qcm[state.qIndex];
  const options=document.querySelectorAll(".option");
  clearInterval(state.qcmTimer);
  options.forEach(o=>o.onclick=null);

  state.qcmTotal++;
  if(choice===state.currentCorrect){
    state.qcmScore++;
    options[choice].classList.add("good");
    addXP(q.xp);
    notify("✅ Bonne réponse !","success");
  }else{
    options[choice].classList.add("bad");
    options[state.currentCorrect].classList.add("good");
    notify("❌ Mauvaise réponse","error");
  }

  setTimeout(()=>{
    state.qIndex++;
    if(state.qIndex>=qcm.length){showQCMResult();}
    else{showQCM();}
  },800);
}

function showQCMResult(){
  clearInterval(state.qcmTimer);
  const total=state.qcmTotal;
  const score=state.qcmScore;
  const note=total===0?0:Math.round((score/total)*20);
  const noteClass=note>=14?"score-good":note>=10?"score-mid":"score-bad";
  let emoji,appreciation;
  if(note>=18){emoji="🏆";appreciation="Excellent ! Félicitations, tu maîtrises parfaitement ce chapitre !";}
  else if(note>=16){emoji="🌟";appreciation="Très bien ! Tu as de solides connaissances.";}
  else if(note>=14){emoji="😊";appreciation="Bien ! Continue comme ça, tu es sur la bonne voie.";}
  else if(note>=12){emoji="👍";appreciation="Assez bien. Quelques révisions s'imposent sur les points manqués.";}
  else if(note>=10){emoji="😐";appreciation="Passable. Il faut revoir certaines notions importantes.";}
  else if(note>=8){emoji="😟";appreciation="Insuffisant. Reprends le cours et refais le QCM.";}
  else if(note>=5){emoji="😢";appreciation="Faible. Revois attentivement l'ensemble du chapitre.";}
  else{emoji="💀";appreciation="Très faible. Il faut tout revoir depuis le début !";}

  addXP(note*5);
  app.innerHTML=`
  <div class="card score-card">
    <h2>📊 Résultats du QCM</h2>
    <p style="color:#94a3b8;font-size:13px;">${chapters[state.currentChapter].title}</p>
    <div class="score-note ${noteClass}">${emoji} ${note}/20</div>
    <p style="font-size:16px;margin:6px 0;">
      ✅ <strong>${score}</strong> bonne${score>1?"s":""} réponse${score>1?"s":""} sur <strong>${total}</strong>
    </p>
    <div style="background:#1e293b;border-radius:12px;padding:12px 15px;margin:10px 0;font-size:14px;color:#e2e8f0;line-height:1.5;">
      ${appreciation}
    </div>
    <p style="color:#94a3b8;font-size:12px;">+${note*5} XP gagnés</p>
    <button onclick="startQCM('${state.currentChapter}')">🔄 Rejouer</button>
    <button class="quit-btn" onclick="home()">🏠 Accueil</button>
  </div>`;
}

function quitQCM(){
  clearInterval(state.qcmTimer);
  state.qIndex=0;
  notify("QCM quitté");
  home();
}

/* ================= MISSION COMMANDO ================= */

function startMission(){
  let allQCM=[];
  Object.keys(chapters).forEach(ch=>{
    chapters[ch].qcm.forEach(q=>{allQCM.push({...q,chapter:ch});});
  });
  const picked=shuffle(allQCM).slice(0,10);
  state.mission={questions:picked,index:0,score:0,timeLeft:240,answered:0};
  showMissionQCM();
}

function showMissionQCM(){
  const m=state.mission;
  clearInterval(state.missionTimer);
  state.missionTimer=setInterval(()=>{
    m.timeLeft--;
    const t=document.getElementById("missionClock");
    if(t){
      const min=Math.floor(m.timeLeft/60);
      const sec=m.timeLeft%60;
      t.innerHTML=`⏱ ${min}:${sec.toString().padStart(2,"0")}`;
      if(m.timeLeft<=30) t.style.color="#ef4444";
    }
    if(m.timeLeft<=0){clearInterval(state.missionTimer);showMissionResult();}
  },1000);
  renderMissionQuestion();
}

function renderMissionQuestion(){
  const m=state.mission;
  const q=m.questions[m.index];
  const shuffled=shuffle(q.options.map((text,index)=>({text,index})));
  m.currentCorrect=shuffled.findIndex(o=>o.index===q.answer);
  const min=Math.floor(m.timeLeft/60);
  const sec=m.timeLeft%60;

  app.innerHTML=`
  <div class="card">
    <div class="mission-timer" id="missionClock">⏱ ${min}:${sec.toString().padStart(2,"0")}</div>
    <div class="mission-progress">Question ${m.index+1} / 10 &nbsp;|&nbsp; ✅ ${m.score} bonne(s)</div>
    <p style="font-size:13px;color:#94a3b8;">📚 ${q.chapter}</p>
    <p><strong>${q.question}</strong></p>
    ${shuffled.map((o,i)=>`<div class="option" onclick="answerMission(${i})">${o.text}</div>`).join("")}
    <button class="quit-btn" onclick="quitMission()" style="margin-top:15px">🚪 Abandonner</button>
  </div>`;
}

function answerMission(choice){
  const m=state.mission;
  const options=document.querySelectorAll(".option");
  options.forEach(o=>o.onclick=null);
  m.answered++;
  if(choice===m.currentCorrect){options[choice].classList.add("good");m.score++;}
  else{options[choice].classList.add("bad");options[m.currentCorrect].classList.add("good");}
  setTimeout(()=>{
    m.index++;
    if(m.index>=10){clearInterval(state.missionTimer);showMissionResult();}
    else{renderMissionQuestion();}
  },1000);
}

function showMissionResult(){
  clearInterval(state.missionTimer);
  const m=state.mission;
  const note=m.answered===0?0:Math.round((m.score/m.answered)*10);
  const noteClass=note>=7?"score-good":note>=5?"score-mid":"score-bad";
  const emoji=note>=7?"🏆":note>=5?"😅":"💀";
  addXP(note*10);
  app.innerHTML=`
  <div class="card score-card">
    <h2>⚡ Mission Commando</h2>
    <div class="score-note ${noteClass}">${emoji} ${note}/10</div>
    <p>${m.score} bonne(s) réponse(s) sur ${m.answered} répondues</p>
    <p style="color:#94a3b8;font-size:13px">+${note*10} XP gagnés</p>
    <button onclick="startMission()">🔄 Rejouer</button>
    <button class="quit-btn" onclick="home()">🏠 Accueil</button>
  </div>`;
}

function quitMission(){
  clearInterval(state.missionTimer);
  notify("Mission abandonnée","error");
  home();
}

/* ================= XP SYSTEM ================= */

function addXP(points){
  state.xp+=points;
  if(state.xp>=state.level*100){state.level++;notify("🔥 LEVEL UP !","success");}
  localStorage.setItem("xp_svt",state.xp);
  localStorage.setItem("level_svt",state.level);
  updateXPBar();
}

function updateXPBar(){
  const fill=document.getElementById("xpFill");
  const xpLabel=document.getElementById("xpLabel");
  const levelLabel=document.getElementById("levelLabel");
  const percent=Math.min((state.xp%(state.level*100))/(state.level*100)*100,100);
  if(fill) fill.style.width=percent+"%";
  if(xpLabel) xpLabel.innerHTML="XP: "+state.xp;
  if(levelLabel) levelLabel.innerHTML="Niveau "+state.level;
}

/* ================= ESSAYS ================= */

function getAllEssays(){
  let all=[];
  Object.keys(chapters).forEach(ch=>{
    if(chapters[ch].essays){
      chapters[ch].essays.forEach((e,i)=>{
        all.push({...e,chapterKey:ch,index:i});
      });
    }
  });
  return all;
}

function getEssayProgress(){
  return JSON.parse(localStorage.getItem("essayProgress_svt"))||{};
}

function saveEssayProgress(title,content){
  const progress=getEssayProgress();
  progress[title]={content,done:true,updatedAt:new Date().toISOString()};
  localStorage.setItem("essayProgress_svt",JSON.stringify(progress));
}

function essayMenu(){
  const progress=getEssayProgress();

  let html=`<div class="card"><h2>✍️ Devoirs écrits</h2>`;

  Object.keys(chapters).forEach(ch=>{
    const essays=chapters[ch].essays;
    if(!essays) return;
    html+=`<p style="color:#86efac;font-size:12px;margin-top:12px;font-weight:bold;">${ch}</p>`;
    essays.forEach((e,i)=>{
      const done=progress[e.title];
      html+=`<button onclick="startEssayByKey('${ch}',${i})" style="background:${done?'#22c55e':'#16a34a'};font-size:13px;">
        ${done?'✅':'📝'} ${e.title}
      </button>`;
    });
  });

  html+=`<br><br><button class="quit-btn" onclick="home()">⬅️ Retour</button></div>`;
  app.innerHTML=html;
}

function startEssayByKey(chKey,i){
  const essay=chapters[chKey].essays[i];
  state.essay=essay;
  state.timer=essay.time;
  clearInterval(state.interval);
  state.interval=setInterval(()=>{
    state.timer--;
    if(state.timer<=0){clearInterval(state.interval);autoSaveEssay();notify("⏰ Temps écoulé !");}
    updateTimer();
  },1000);
  renderEssay();
}

function autoSaveEssay(){
  const textarea=document.getElementById("essayText");
  if(!textarea) return;
  saveEssayProgress(state.essay.title,textarea.value);
}

function liveSaveEssay(){
  const text=document.getElementById("essayText").value;
  saveEssayProgress(state.essay.title,text);
}

function finishEssay(){
  clearInterval(state.interval);
  const text=document.getElementById("essayText").value;
  saveEssayProgress(state.essay.title,text);
  addXP(state.essay.xp);
  notify("Devoir enregistré !");
  essayMenu();
}

function resetEssay(){
  const progress=getEssayProgress();
  delete progress[state.essay.title];
  localStorage.setItem("essayProgress_svt",JSON.stringify(progress));
  renderEssay();
}

function updateTimer(){
  const timer=document.getElementById("timer");
  const fill=document.getElementById("fill");
  const minutes=Math.floor(state.timer/60);
  const seconds=state.timer%60;
  if(timer) timer.innerHTML=`⏱️ ${minutes}:${seconds.toString().padStart(2,"0")}`;
  if(fill) fill.style.width=`${(state.timer/state.essay.time)*100}%`;
}

function renderEssay(){
  const progress=getEssayProgress();
  const oldAnswer=progress[state.essay.title]?.content||"";
  app.innerHTML=`
  <div class="card">
    <h3>${state.essay.title}</h3>
    <div class="bar"><div class="fill" id="fill" style="width:${(state.timer/state.essay.time)*100}%"></div></div>
    <p id="timer"></p>
    <p>${state.essay.question}</p>
    <textarea id="essayText" placeholder="Rédige ta réponse..." oninput="liveSaveEssay()">${oldAnswer}</textarea>
    <button onclick="sendEssay()">🤖 Corriger avec IA</button>
    <button onclick="finishEssay()">Enregistrer</button>
    <button onclick="resetEssay()"> Recommencer</button>
    <br><br>
    <button class="quit-btn" onclick="essayMenu()">Retour</button>
  </div>`;
}

function sendEssay(){
  const text=document.getElementById("essayText").value;
  if(!text.trim()){alert("Écris quelque chose !");return;}
  const prompt=`Corrige ce devoir de SVT :\n\nQUESTION:\n${state.essay.question}\n\nREPONSE:\n${text}\n\nDonne:\n- note /20\n- erreurs\n- correction`;
  window.open("https://chatgpt.com/?q="+encodeURIComponent(prompt));
}

/* ================= NOTIFY ================= */

function notify(message,type="info",duration=3500){
  const container=document.getElementById("notif-container");
  const div=document.createElement("div");
  div.className=`notif ${type}`;
  div.innerText=message;
  container.appendChild(div);
  setTimeout(()=>{div.remove();},duration);
}

/* ================= INIT ================= */

updateXPBar();
home();

</script>
